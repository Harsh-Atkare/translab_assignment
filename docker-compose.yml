
services:

  app:
    build: .
    image: translab-assignment:local
    container_name: kb-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: docker
      LOG_JSON: "true"
    volumes:
      - kb-data:/app/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: kb-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: kb-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/db.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - kb-grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  kb-data:
  kb-grafana:
