name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm install --no-audit --no-fund && npm run build

      - name: Run tests
        env:
          # A dummy key is enough - the suite stubs out every Gemini call,
          # so nothing here touches the network or burns free-tier quota.
          GEMINI_API_KEY: test-key
        run: pytest --cov=app --cov-report=term-missing

  validate-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: Check manifests against the Kubernetes schema
        run: |
          # ServiceMonitor is a CRD from kube-prometheus-stack, so the schema
          # isn't in the standard set - skip it rather than fail the build.
          kubeconform -strict -summary \
            -skip ServiceMonitor \
            -ignore-missing-schemas \
            k8s/

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [test, validate-manifests]
    # Don't publish images for pull requests - only for merged code.
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is injected automatically - no secret to configure.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # There is no cloud cluster behind this job - the demo runs on minikube
      # on a laptop, which GitHub's runners cannot reach. The step below prints
      # the exact commands a real deploy would run. To make it live, add a
      # KUBE_CONFIG secret and swap the echo for the kubectl calls.
      - name: Deploy to Kubernetes (dry run)
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Would run:"
          echo "  kubectl -n knowledge-assistant set image deployment/kb-app app=$IMAGE"
          echo "  kubectl -n knowledge-assistant rollout status deployment/kb-app --timeout=180s"

      # - name: Configure kubectl
      #   uses: azure/k8s-set-context@v4
      #   with:
      #     method: kubeconfig
      #     kubeconfig: ${{ secrets.KUBE_CONFIG }}
