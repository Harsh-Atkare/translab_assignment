name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm install --no-audit --no-fund && npm run build

      - name: Run tests
        env:
          GEMINI_API_KEY: test-key
        run: pytest --cov=app --cov-report=term-missing

  validate-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: Check manifests against the Kubernetes schema
        run: |
          kubeconform -strict -summary \
            -skip ServiceMonitor \
            -ignore-missing-schemas \
            k8s/

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [test, validate-manifests]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to minikube
    runs-on: self-hosted
    needs: [test, validate-manifests]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Check the cluster is up
        run: |
          minikube status || { echo "minikube is not running - start it and re-run"; exit 1; }
          kubectl -n knowledge-assistant get deployment kb-app

      - name: Build into minikube's Docker daemon
        run: |
          eval $(minikube docker-env)
          docker build -t translab-assignment:${{ github.sha }} .
          docker images | grep translab | head -3

      - name: Roll out the new image
        run: |
          kubectl -n knowledge-assistant set image deployment/kb-app \
            app=translab-assignment:${{ github.sha }}
          kubectl -n knowledge-assistant rollout status deployment/kb-app --timeout=300s

      - name: Verify it answers
        run: |
          kubectl -n knowledge-assistant wait --for=condition=ready pod \
            -l app=kb-app --timeout=120s

          kubectl -n knowledge-assistant port-forward svc/kb-app 18080:80 &
          FORWARD=$!
          sleep 5

          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/healthz)
          kill $FORWARD 2>/dev/null || true

          [ "$code" = "200" ] || { echo "health check returned $code"; exit 1; }
          echo "Deployed and healthy: translab-assignment:${{ github.sha }}"

      - name: Summary
        run: |
          {
            echo "### Deployed to minikube"
            echo ""
            echo "Image: \`translab-assignment:${{ github.sha }}\`"
            echo ""
            kubectl -n knowledge-assistant get pods -l app=kb-app
          } >> $GITHUB_STEP_SUMMARY
