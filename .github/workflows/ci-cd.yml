      # - name: Roll out
      #   run: |
      #     kubectl -n knowledge-assistant set image deployment/kb-app \
      #       app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      #     kubectl -n knowledge-assistant rollout status deployment/kb-app --timeout=180s
