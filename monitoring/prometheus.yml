global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: knowledge-assistant
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: knowledge-assistant
          env: docker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
