loki:
  enabled: true
  isDefault: false
  persistence:
    enabled: false        # fine for a demo cluster; use a PVC for anything real

promtail:
  enabled: true
  config:
    snippets:
      pipelineStages:
        - cri: {}
        - json:
            expressions:
              level: level
              logger: logger
              request_id: request_id
        - labels:
            level:

grafana:
  enabled: false          # kube-prometheus-stack already ships Grafana

prometheus:
  enabled: false
