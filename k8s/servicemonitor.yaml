apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kb-app
  namespace: knowledge-assistant
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: kb-app
  namespaceSelector:
    matchNames:
      - knowledge-assistant
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
